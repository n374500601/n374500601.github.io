<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<!-- hack iOS CSS :active style -->
<body ontouchstart="">

    {% include nav.html %}

    {{ content }}

    {% include footer.html %}

    {% if site.ui_version %}
    <div class="site-ui-version">版本 {{ site.ui_version }}</div>
    <style>
        .site-ui-version {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 9999;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(20, 20, 20, 0.72);
            color: #fff;
            font-size: 12px;
            line-height: 1;
            letter-spacing: 0.02em;
            pointer-events: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
    </style>
    {% endif %}


<!-- Image to hack wechat -->
<img src="/img/apple-touch-icon.png" width="0" height="0" />
<!-- Migrate from head to bottom, no longer block render and still work -->

</body>

</html>
